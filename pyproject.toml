[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-platform"
version = "1.0.0"
description = "End-to-end MLOps platform for churn and fraud detection"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.flake8]
max-line-length = 120
exclude = ["venv", "__pycache__", ".git", "*.egg-info"]
